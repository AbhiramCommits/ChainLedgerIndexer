name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Ruff lint + format
        run: uv run ruff check . && uv run ruff format --check .
      - name: Mypy
        run: uv run mypy chainledger

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Unit tests + coverage (chainledger.indexer)
        run: >
          uv run pytest -m "not integration"
          --cov=chainledger.indexer --cov-fail-under=80 --cov-report=term-missing
      - name: Unit tests + coverage (chainledger.api)
        run: >
          uv run pytest -m "not integration"
          --cov=chainledger.api --cov-fail-under=80 --cov-report=term-missing
      - name: Anvil integration test
        run: uv run pytest -m "integration" -v
