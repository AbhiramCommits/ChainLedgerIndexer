[project]
name = "chainledger"
version = "0.1.0"
description = "Real-time Ethereum ERC-20 Transfer event indexer with a REST API"
requires-python = ">=3.11"
dependencies = [
    "alembic==1.19.2",
    "eth-utils==6.0.0",
    "fastapi==0.141.1",
    "prometheus-client==0.26.0",
    "psycopg[binary]==3.3.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.52",
    "structlog==26.1.0",
    "tenacity==9.1.4",
    "tqdm==4.70.0",
    "uvicorn[standard]==0.52.4",
    "web3==8.0.0",
    "websockets==17.1",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.7",
    "testcontainers==4.15.0",
    "types-tqdm==4.70.0.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chainledger"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true

[[tool.mypy.overrides]]
module = ["web3.*", "alembic.*", "psycopg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: tests that require a local anvil binary on PATH"]

[tool.coverage.run]
source = ["chainledger"]

[tool.coverage.report]
show_missing = true
